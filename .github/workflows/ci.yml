name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/cli-ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python (lint, typecheck, test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/cli-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  cross-language-parity:
    name: Cross-language parity (TS <-> Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/cli-ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build TypeScript package
        working-directory: packages/cli-ts
        run: |
          npm ci
          npm run build
      - name: Install Python package
        working-directory: packages/cli-py
        run: pip install -e ".[dev]"
      - name: Run Python-side parity test (invokes the built TS CLI as a subprocess)
        working-directory: packages/cli-py
        run: pytest -q tests/test_cross_language_parity.py -v
      - name: Run TypeScript-side parity test (invokes the Python CLI as a subprocess)
        working-directory: packages/cli-ts
        run: npx vitest run test/cross-language-parity.test.ts
