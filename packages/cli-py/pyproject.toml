[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "paceproof-cli"
version = "0.1.0"
description = "CLI that verifies Ed25519-signed compute-attestation records from any provider and reports what compute was actually run, by whom, and whether every signature checks out. Read-only reporting layer -- does not sign or generate attestations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rudrendu Paul" }]
keywords = [
  "compute-attestation",
  "ai-governance",
  "cryptographic-verification",
  "ed25519",
  "cli",
  "audit-trail",
  "compute-governance",
  "attestation-verification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "click>=8.1",
  "PyNaCl>=1.5",
  "jsonschema[format]>=4.19",
]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/PaceProof#readme"
Repository = "https://github.com/RudrenduPaul/PaceProof"
Issues = "https://github.com/RudrenduPaul/PaceProof/issues"

[project.scripts]
paceproof = "paceproof_cli.cli:main"
paceproof-cli = "paceproof_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/paceproof_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/paceproof_cli/schema/attestation-record.schema.json" = "paceproof_cli/schema/attestation-record.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# dashboard.py's CSS block lives inside a triple-quoted f-string -- wrapping
# CSS declarations mid-rule to satisfy a Python line-length rule would only
# make the stylesheet harder to read for no real benefit.
"src/paceproof_cli/dashboard.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
